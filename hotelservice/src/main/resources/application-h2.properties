# Configuration Hôtel 2
spring.application.name=hotelservice-h2
server.port=8082

# gRPC port
grpc.server.port=9092

# Infos hôtel (injectées dans DataInitializer)
hotel.code=H2
hotel.name= Grand Occitanie
hotel.stars=3
hotel.ville=Montpellier
hotel.pays=France
hotel.rue=Vert bois
hotel.numero=15
hotel.latitude=45.7578
hotel.longitude=4.8320
hotel.image-url=http://localhost:8082/images/room2.jpg

# H2 Database
spring.datasource.url=jdbc:h2:mem:hotel2db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false