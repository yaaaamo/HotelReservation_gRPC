<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { margin-bottom: 30px; }
        nav a { margin-right: 20px; }
        .success { background: #d4edda; padding: 20px; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; padding: 20px; border: 1px solid #f5c6cb; }
        .details { margin-top: 20px; }
        .details p { margin: 5px 0; }
    </style>
</head>
<body>
<nav>
    <a href="/">Accueil</a>
    <a href="/search">Nouvelle recherche</a>
</nav>

<h1>Confirmation</h1>

<div th:if="${response.confirmed}" class="success">
    <p><strong>Reservation confirmee</strong></p>
    <div class="details">
        <p><strong>Reference:</strong> <span th:text="${response.reservationReference}"></span></p>
        <p><strong>Hotel:</strong> <span th:text="${hotelName}"></span></p>
        <p><strong>Prix total:</strong> <span th:text="${#numbers.formatDecimal(response.totalPrice, 1, 2)} + ' EUR'"></span></p>
    </div>
</div>

<div th:unless="${response.confirmed}" class="error">
    <p><strong>Echec de la reservation</strong></p>
    <p th:text="${response.message}"></p>
</div>
</body>
</html>
