<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotels</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { margin-bottom: 30px; }
        nav a { margin-right: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; }

        .status { font-weight: bold; }
        .status-online { color: green; }
        .status-offline { color: red; }
        .status-timeout { color: #0aa; }
        .status-auth { color: #c90; }
        .status-error { color: #b00; }
    </style>
</head>
<body>
<nav>
    <a href="/">Accueil</a>
    <a href="/search">Rechercher</a>
</nav>

<h1>Hotels</h1>

    <div th:if="${hotelWarnings != null and !hotelWarnings.isEmpty()}"
         style="background:#ffe6e6;color:#900;padding:10px;margin-bottom:15px;border:1px solid #d00;">
        <div th:each="w : ${hotelWarnings.entrySet()}">
            ⚠️ <strong th:text="${w.key}"></strong> :
            <span th:text="${w.value}"></span>
        </div>
    </div>


<table>
    <tr>
        <th>Nom</th>
        <th>Etoiles</th>
        <th>Ville</th>
        <th>Pays</th>
        <th>Adresse</th>
        <th>Statut</th>
    </tr>

    <tr th:each="entry : ${hotels}">
        <td th:text="${entry.value.name}"></td>
        <td th:text="${entry.value.stars} + ' *'"></td>
        <td th:text="${entry.value.address.city}"></td>
        <td th:text="${entry.value.address.country}"></td>
        <td th:text="${entry.value.address.number + ' ' + entry.value.address.street}"></td>

        <td th:switch="${onlineStatus[entry.key] != null ? onlineStatus[entry.key].name() : 'ERROR'}">
            <span class="status status-online" th:case="'ONLINE'">ONLINE</span>
            <span class="status status-offline" th:case="'OFFLINE'">OFFLINE</span>
            <span class="status status-timeout" th:case="'TIMEOUT'">TIMEOUT</span>
            <span class="status status-auth" th:case="'AUTH_FAILED'">AUTH FAILED</span>
            <span class="status status-error" th:case="*">ERROR</span>
        </td>


    </tr>
</table>
</body>
</html>
