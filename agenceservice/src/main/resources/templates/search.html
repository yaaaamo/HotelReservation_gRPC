<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rechercher</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { margin-bottom: 30px; }
        nav a { margin-right: 20px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; }
        .price-range { display: flex; gap: 10px; }
        .price-range input { width: 45%; }
        .online { color: green; }
        .offline { color: red; }
    </style>
</head>
<body>
<nav>
    <a href="/">Accueil</a>
    <a href="/hotels">Hotels</a>
</nav>

<h1>Rechercher disponibilites</h1>

<form method="post" action="/search">
    <label>Date arrivee
        <input type="date" name="startDate" required>
    </label>

    <label>Date depart
        <input type="date" name="endDate" required>
    </label>

    <label>Nombre de personnes
        <input type="number" name="guests" min="1" max="10" value="2" required>
    </label>

    <label>Prix (EUR)
        <div class="price-range">
            <input type="number" name="minPrice" placeholder="Min" value="0" min="0">
            <input type="number" name="maxPrice" placeholder="Max" value="1000" min="0">
        </div>
    </label>

    <label>Hotel
        <select name="hotelName">
            <option value="">-- Tous les hotels --</option>
            <th:block th:each="hotel : ${hotels}">
                <option th:if="${onlineStatus[hotel]}" th:value="${hotel}" th:text="${hotel} + ' (en ligne)'"></option>
                <option th:unless="${onlineStatus[hotel]}" th:value="${hotel}" th:text="${hotel} + ' (hors ligne)'" disabled></option>
            </th:block>
        </select>
    </label>

    <button type="submit">Rechercher</button>
</form>
</body>
</html>
