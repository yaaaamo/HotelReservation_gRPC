<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { margin-bottom: 30px; }
        nav a { margin-right: 20px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; }
        h2 { margin-top: 30px; font-size: 16px; }
        .summary { background: #f5f5f5; padding: 15px; margin-bottom: 20px; }
        .summary p { margin: 5px 0; }
    </style>
</head>
<body>
<nav>
    <a href="/">Accueil</a>
    <a href="/search">Rechercher</a>
</nav>

<h1>Reservation</h1>

<div class="summary">
    <p><strong>Hotel:</strong> <span th:text="${hotelName}"></span></p>
    <p><strong>Chambre:</strong> <span th:text="${roomType}"></span></p>
    <p><strong>Dates:</strong> <span th:text="${startDate} + ' au ' + ${endDate}"></span></p>
    <p><strong>Prix:</strong> <span th:text="${#numbers.formatDecimal(price, 1, 2)} + ' EUR'"></span></p>
</div>

<form method="post" action="/reserve">
    <input type="hidden" name="hotelName" th:value="${hotelName}">
    <input type="hidden" name="offerId" th:value="${offerId}">
    <input type="hidden" name="startDate" th:value="${startDate}">
    <input type="hidden" name="endDate" th:value="${endDate}">

    <h2>Client</h2>

    <label>Prenom
        <input type="text" name="firstName" required>
    </label>

    <label>Nom
        <input type="text" name="lastName" required>
    </label>

    <label>Email
        <input type="email" name="email" required>
    </label>

    <label>Telephone
        <input type="tel" name="phone" required>
    </label>

    <h2>Paiement</h2>

    <label>Numero de carte
        <input type="text" name="cardNumber" placeholder="1234 5678 9012 3456" required>
    </label>

    <label>Titulaire
        <input type="text" name="cardHolder" required>
    </label>

    <label>Expiration
        <input type="text" name="expiryDate" placeholder="MM/YY" required>
    </label>

    <label>CVV
        <input type="text" name="cvv" maxlength="3" required>
    </label>

    <button type="submit">Confirmer</button>
</form>
</body>
</html>
